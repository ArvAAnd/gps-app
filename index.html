<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Трилатерація - Лабораторна №3</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        body { margin: 0; background-color: #111; color: #fff; font-family: sans-serif; display: flex; height: 100vh; }
        #plot { flex: 1; height: 100%; }
        #sidebar { width: 350px; background: #222; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .stat { margin-bottom: 15px; font-size: 14px; }
        .stat span { font-weight: bold; color: #0f0; }
        h2 { margin-top: 0; color: #0aa; }
    </style>
</head>
<body>
    <div id="sidebar">
        <h2>GPS Монітор</h2>
        <div class="stat">Статус: <span id="status" style="color: yellow;">З'єднання...</span></div>
        <div class="stat">Супутників: <span id="sat-count">0</span></div>
        <div class="stat">Розкид часу (мс): <span id="time-spread">0</span></div>
        <hr>
        <div class="stat" style="color: #ff4444;">Аналітичний X: <span id="an-x">-</span></div>
        <div class="stat" style="color: #ff4444;">Аналітичний Y: <span id="an-y">-</span></div>
        <br>
        <div class="stat" style="color: #44ff44;">Чисельний X: <span id="num-x">-</span></div>
        <div class="stat" style="color: #44ff44;">Чисельний Y: <span id="num-y">-</span></div>
    </div>
    <div id="plot"></div>

    <script>
        const C = 300; 
        const MAX_TIME_SPREAD = 100; 
        const HISTORY_LENGTH = 15; 
        
        let satellites = {};
        let analyticalHistory = [];
        let numericalHistory = [];

        const layout = {
            title: { text: 'GPS Позиціонування', font: { color: '#fff' } },
            xaxis: { range: [0, 100], title: 'X (км)', gridcolor: '#444', color: '#fff' },
            yaxis: { range: [0, 100], title: 'Y (км)', gridcolor: '#444', color: '#fff', scaleanchor: 'x', scaleratio: 1 },
            plot_bgcolor: '#111', paper_bgcolor: '#111',
            margin: { l: 50, r: 50, t: 50, b: 50 },
            showlegend: true,
            legend: { font: { color: '#fff' } }
        };

        Plotly.newPlot('plot', [], layout, {responsive: true});

        const ws = new WebSocket('ws://localhost:21701');

        ws.onopen = () => document.getElementById('status').innerText = "Підключено (🟢)";
        ws.onclose = () => {
            document.getElementById('status').innerText = "Відключено (🔴)";
            document.getElementById('status').style.color = 'red';
        };

        ws.onmessage = (e) => {
            const data = JSON.parse(e.data);
            data.r = C * (data.receivedAt - data.sentAt);
            satellites[data.id] = data;
            processPositions();
        };

        function calculateAnalytical(s1, s2, s3) {
            const A = 2 * (s2.x - s1.x);
            const B = 2 * (s2.y - s1.y);
            const C = Math.pow(s1.r, 2) - Math.pow(s2.r, 2) - Math.pow(s1.x, 2) + Math.pow(s2.x, 2) - Math.pow(s1.y, 2) + Math.pow(s2.y, 2);
            
            const D = 2 * (s3.x - s2.x);
            const E = 2 * (s3.y - s2.y);
            const F = Math.pow(s2.r, 2) - Math.pow(s3.r, 2) - Math.pow(s2.x, 2) + Math.pow(s3.x, 2) - Math.pow(s2.y, 2) + Math.pow(s3.y, 2);
            
            const denomX = E * A - B * D;
            const denomY = B * D - A * E;
            
            if (Math.abs(denomX) < 1e-5 || Math.abs(denomY) < 1e-5) return null;
            
            const x = (C * E - F * B) / denomX;
            const y = (C * D - A * F) / denomY;
            return {x, y};
        }

        function calculateNumerical(sats, startX, startY) {
            let x = startX || 50;
            let y = startY || 50;
            const lr = 0.05; 
            
            for (let iter = 0; iter < 100; iter++) {
                let dx = 0;
                let dy = 0;
                
                for (let s of sats) {
                    const dist = Math.sqrt(Math.pow(x - s.x, 2) + Math.pow(y - s.y, 2));
                    if (dist === 0) continue;
                    const error = dist - s.r;
                    dx += 2 * error * ((x - s.x) / dist);
                    dy += 2 * error * ((y - s.y) / dist);
                }
                
                x -= lr * dx;
                y -= lr * dy;
            }
            return {x, y};
        }

        function processPositions() {
            const now = Date.now();
            const sats = Object.values(satellites).filter(s => (now - s.receivedAt) < 2000);
            
            document.getElementById('sat-count').innerText = sats.length;
            
            if (sats.length < 3) return;
            
            const latest3 = sats.sort((a, b) => b.receivedAt - a.receivedAt).slice(0, 3);
            const times = latest3.map(s => s.receivedAt);
            const spread = Math.max(...times) - Math.min(...times);
            
            document.getElementById('time-spread').innerText = spread.toFixed(2);
            
            if (spread > MAX_TIME_SPREAD) return;

            const anPos = calculateAnalytical(latest3[0], latest3[1], latest3[2]);
            if (!anPos) return;

            const numPos = calculateNumerical(latest3, anPos.x, anPos.y);

            document.getElementById('an-x').innerText = anPos.x.toFixed(2);
            document.getElementById('an-y').innerText = anPos.y.toFixed(2);
            document.getElementById('num-x').innerText = numPos.x.toFixed(2);
            document.getElementById('num-y').innerText = numPos.y.toFixed(2);

            updateHistory(analyticalHistory, anPos);
            updateHistory(numericalHistory, numPos);

            drawChart(latest3);
        }

        function updateHistory(history, pos) {
            history.push(pos);
            if (history.length > HISTORY_LENGTH) history.shift();
        }

        function drawChart(sats) {
            const satTrace = {
                x: sats.map(s => s.x),
                y: sats.map(s => s.y),
                mode: 'markers+text',
                type: 'scatter',
                name: 'Супутники',
                text: sats.map((s, i) => `S${i+1}`),
                textposition: 'top center',
                marker: { size: 15, color: '#00ccff', symbol: 'triangle-up' }
            };

            const anTrace = {
                x: analyticalHistory.map(p => p.x),
                y: analyticalHistory.map(p => p.y),
                mode: 'lines+markers',
                type: 'scatter',
                name: 'Аналітичний метод',
                line: { color: 'rgba(255, 68, 68, 0.3)' },
                marker: { 
                    size: 8, 
                    color: '#ff4444',
                    opacity: analyticalHistory.map((_, i) => (i + 1) / HISTORY_LENGTH)
                }
            };

            const numTrace = {
                x: numericalHistory.map(p => p.x),
                y: numericalHistory.map(p => p.y),
                mode: 'lines+markers',
                type: 'scatter',
                name: 'Чисельний метод',
                line: { color: 'rgba(68, 255, 68, 0.3)' },
                marker: { 
                    size: 8, 
                    color: '#44ff44',
                    opacity: numericalHistory.map((_, i) => (i + 1) / HISTORY_LENGTH)
                }
            };

            Plotly.react('plot', [satTrace, anTrace, numTrace], layout);
        }
    </script>
</body>
</html>
